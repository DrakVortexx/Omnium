<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .game-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            z-index: 100;
        }

        .game-ui h3 {
            margin: 0 0 10px 0;
            color: #e94560;
        }

        .back-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .back-btn:hover {
            background: #ff6b6b;
        }

        .game-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
            z-index: 100;
        }

        .placeholder-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 50;
        }

        .placeholder-message h2 {
            font-size: 2rem;
            color: #e94560;
            margin-bottom: 1rem;
        }

        .placeholder-message p {
            color: #ccc;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div class="game-ui">
            <h3>🎮 Game</h3>
            <p>Player: <span id="player-username">Loading...</span></p>
            <button class="back-btn" onclick="goToDashboard()">← Back to Dashboard</button>
        </div>

        <div class="game-info">
            <p>Game coming soon!</p>
        </div>

        <div class="placeholder-message">
            <h2>🎮 Game Under Development</h2>
            <p>The game experience will be available soon!</p>
        </div>
    </div>

    <script>
        async function checkAuth() {
            try {
                const response = await fetch('/auth/me');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('player-username').textContent = data.user.username || 'Player';
                } else {
                    window.location.href = '/login';
                }
            } catch (error) {
                window.location.href = '/login';
            }
        }

        function goToDashboard() {
            window.location.href = '/dashboard';
        }

        checkAuth();
    </script>
</body>
</html>
