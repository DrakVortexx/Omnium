<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnium - Multiplayer Story MMO</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            height: 100vh;
            overflow: hidden;
        }

        #login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        #login-screen h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        #login-screen input {
            padding: 15px 25px;
            font-size: 1.2rem;
            border: 2px solid #e94560;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
            margin-bottom: 1rem;
            width: 300px;
            text-align: center;
        }

        #login-screen input:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.5);
        }

        #login-screen button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        #login-screen button:hover {
            background: #ff6b6b;
            transform: scale(1.05);
        }

        #game-container {
            display: none;
            height: 100vh;
            grid-template-columns: 1fr 350px;
            grid-template-rows: 60px 1fr 200px;
            gap: 10px;
            padding: 10px;
        }

        #game-container.active {
            display: grid;
        }

        #header {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        #header h1 {
            color: #e94560;
            font-size: 1.5rem;
        }

        #player-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .stat-box {
            background: rgba(233, 69, 96, 0.2);
            padding: 8px 15px;
            border-radius: 5px;
            border: 1px solid #e94560;
        }

        #game-world {
            grid-column: 1 / 2;
            grid-row: 2 / 3;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 2px solid #e94560;
        }

        #game-canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #sidebar {
            grid-column: 2 / 3;
            grid-row: 2 / 4;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
        }

        .panel h2 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .item-card:hover {
            background: rgba(233, 69, 96, 0.2);
        }

        .item-card button {
            background: #e94560;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        #chat-panel {
            grid-column: 1 / 2;
            grid-row: 3 / 4;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }

        .chat-message {
            margin-bottom: 10px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }

        .chat-message .player-name {
            color: #e94560;
            font-weight: bold;
        }

        #chat-input-container {
            display: flex;
            padding: 10px;
            gap: 10px;
        }

        #chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #e94560;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
        }

        #chat-input:focus {
            outline: none;
        }

        #send-btn {
            padding: 10px 20px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #story-panel {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
        }

        .story-progress {
            margin-top: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            transition: width 0.5s;
        }

        .player-dot {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s;
        }

        .player-dot .name-tag {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            white-space: nowrap;
        }

        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 15px 25px;
            background: rgba(233, 69, 96, 0.9);
            color: white;
            border-radius: 10px;
            animation: slideIn 0.3s, fadeOut 0.3s 2.7s;
            z-index: 1000;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="login-screen">
        <h1>⚔️ Omnium ⚔️</h1>
        <input type="text" id="player-name" placeholder="Enter your name" maxlength="20">
        <button onclick="joinGame()">Enter World</button>
    </div>

    <div id="game-container">
        <div id="header">
            <h1>⚔️ Omnium</h1>
            <div id="player-info">
                <div class="stat-box">💰 <span id="gold-display">0</span></div>
                <div class="stat-box">📖 Story: <span id="story-display">0</span>/10</div>
            </div>
        </div>

        <div id="game-world">
            <canvas id="game-canvas"></canvas>
        </div>

        <div id="sidebar">
            <div class="panel">
                <h2>🛒 Market</h2>
                <div id="market-list" class="item-list"></div>
            </div>
            <div class="panel">
                <h2>🎒 Inventory</h2>
                <div id="inventory-list" class="item-list"></div>
            </div>
            <div class="panel">
                <h2>📖 Story Progress</h2>
                <div class="story-progress">
                    <p>Advance through the story to earn rewards!</p>
                    <div class="progress-bar">
                        <div id="story-progress-fill" class="progress-fill" style="width: 0%"></div>
                    </div>
                    <button onclick="advanceStory()" style="margin-top: 15px; padding: 10px 20px; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer;">Advance Story</button>
                </div>
            </div>
        </div>

        <div id="chat-panel">
            <div id="chat-messages"></div>
            <div id="chat-input-container">
                <input type="text" id="chat-input" placeholder="Type a message...">
                <button id="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentPlayer = null;
        let players = {};
        let market = [];
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // Resize canvas
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Join game
        function joinGame() {
            const name = document.getElementById('player-name').value.trim();
            if (name) {
                socket.emit('player_join', { name });
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-container').classList.add('active');
            }
        }

        // Socket events
        socket.on('player_init', (player) => {
            currentPlayer = player;
            document.getElementById('gold-display').textContent = player.gold;
            document.getElementById('story-display').textContent = player.storyProgress;
            document.getElementById('story-progress-fill').style.width = (player.storyProgress * 10) + '%';
        });

        socket.on('players_update', (updatedPlayers) => {
            players = {};
            updatedPlayers.forEach(p => {
                players[p.id] = p;
            });
            updateInventory();
        });

        socket.on('player_moved', (data) => {
            if (players[data.id]) {
                players[data.id].x = data.x;
                players[data.id].y = data.y;
            }
        });

        socket.on('market_update', (updatedMarket) => {
            market = updatedMarket;
            updateMarket();
        });

        socket.on('purchase_success', (data) => {
            showNotification(`Purchased ${data.item.name}!`);
            document.getElementById('gold-display').textContent = data.remainingGold;
        });

        socket.on('purchase_failed', (data) => {
            showNotification(data.reason);
        });

        socket.on('sell_success', (data) => {
            showNotification(`Sold ${data.item.name} for ${data.goldGained} gold!`);
        });

        socket.on('story_update', (data) => {
            document.getElementById('story-display').textContent = data.progress;
            document.getElementById('story-progress-fill').style.width = (data.progress * 10) + '%';
        });

        socket.on('story_reward', (data) => {
            showNotification(`Story milestone reached! Earned ${data.reward} gold!`);
            document.getElementById('gold-display').textContent = currentPlayer.gold + data.reward;
        });

        socket.on('chat_broadcast', (data) => {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'chat-message';
            messageDiv.innerHTML = `<span class="player-name">${data.player}:</span> ${data.message}`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        // Update market display
        function updateMarket() {
            const marketList = document.getElementById('market-list');
            marketList.innerHTML = '';
            
            market.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item-card';
                itemDiv.innerHTML = `
                    <div>
                        <strong>${item.itemId.charAt(0).toUpperCase() + item.itemId.slice(1)}</strong>
                        <br>Price: ${item.price} gold
                        <br>Seller: ${item.seller}
                        <br>Qty: ${item.quantity}
                    </div>
                    <button onclick="buyItem(${item.id})">Buy</button>
                `;
                marketList.appendChild(itemDiv);
            });
        }

        // Update inventory display
        function updateInventory() {
            if (!currentPlayer) return;
            
            const inventoryList = document.getElementById('inventory-list');
            inventoryList.innerHTML = '';
            
            Object.entries(currentPlayer.inventory).forEach(([itemId, quantity]) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item-card';
                itemDiv.innerHTML = `
                    <div>
                        <strong>${itemId.charAt(0).toUpperCase() + itemId.slice(1)}</strong>
                        <br>Quantity: ${quantity}
                    </div>
                    <button onclick="sellItem('${itemId}')">Sell</button>
                `;
                inventoryList.appendChild(itemDiv);
            });
        }

        // Buy item
        function buyItem(marketId) {
            socket.emit('buy_item', { marketId });
        }

        // Sell item
        function sellItem(itemId) {
            socket.emit('sell_item', { itemId });
        }

        // Advance story
        function advanceStory() {
            socket.emit('story_progress', {});
        }

        // Send chat message
        function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (message) {
                socket.emit('chat_message', { message });
                input.value = '';
            }
        }

        // Show notification
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Canvas click to move
        canvas.addEventListener('click', (e) => {
            if (!currentPlayer) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            socket.emit('player_move', { x, y });
        });

        // Game loop
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            ctx.strokeStyle = 'rgba(233, 69, 96, 0.1)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Draw players
            Object.values(players).forEach(player => {
                const isCurrentPlayer = player.id === socket.id;
                
                // Draw player dot
                ctx.beginPath();
                ctx.arc(player.x, player.y, 10, 0, Math.PI * 2);
                ctx.fillStyle = isCurrentPlayer ? '#e94560' : '#4ecdc4';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Draw name tag
                ctx.fillStyle = '#fff';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(player.name, player.x, player.y - 20);
            });
            
            requestAnimationFrame(gameLoop);
        }
        
        gameLoop();

        // Chat input enter key
        document.getElementById('chat-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Login enter key
        document.getElementById('player-name').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                joinGame();
            }
        });
    </script>
</body>
</html>
