<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .container h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #e94560;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
        }

        /* Logged In Screen */
        .logged-in-screen {
            display: none;
        }

        .logged-in-screen.active {
            display: block;
        }

        .logged-in-screen h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #4ecdc4;
        }

        .logged-in-screen p {
            margin-bottom: 1.5rem;
            color: #ccc;
        }

        /* Auth Forms */
        .auth-forms {
            display: none;
        }

        .auth-forms.active {
            display: block;
        }

        .tabs {
            display: flex;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(233, 69, 96, 0.3);
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            color: #ccc;
        }

        .tab.active {
            color: #e94560;
            border-bottom: 2px solid #e94560;
        }

        .tab:hover {
            color: #ff6b6b;
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ccc;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            font-size: 1rem;
            border: 2px solid rgba(233, 69, 96, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #eee;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #e94560;
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .auth-btn:hover {
            background: #ff6b6b;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            background: #4285f4;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-btn:hover {
            background: #357ae8;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.4);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #ccc;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(233, 69, 96, 0.3);
        }

        .divider span {
            padding: 0 10px;
            font-size: 0.9rem;
        }

        .message {
            margin-top: 1rem;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-size: 0.9rem;
            display: none;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        /* Username Setup Screen */
        .username-setup {
            display: none;
        }

        .username-setup.active {
            display: block;
        }

        /* Dashboard Screen */
        .dashboard-screen {
            display: none;
        }

        .dashboard-screen.active {
            display: block;
        }

        .dashboard-screen h2 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #4ecdc4;
        }

        .dashboard-screen p {
            margin-bottom: 2rem;
            color: #ccc;
        }

        .play-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(233, 69, 96, 0.4);
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 40px rgba(233, 69, 96, 0.6);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        /* Game World Screen */
        .game-world {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
        }

        .game-world.active {
            display: block;
        }

        .game-field {
            width: 100%;
            height: 100%;
            background-image: url('/assets/models/stationground-1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .game-ui {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            color: white;
        }

        .back-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        .back-btn:hover {
            background: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Logged In Screen (Dashboard) -->
        <div id="logged-in-screen" class="logged-in-screen">
            <h1>✓ Logged In</h1>
            <h2>Registered & Authenticated</h2>
            <p>Welcome back, <span id="logged-username">User</span>!</p>
            <button class="play-btn" onclick="enterGameWorld()">▶ PLAY</button>
            <button class="auth-btn" onclick="logout()" style="margin-top: 2rem;">Logout</button>
        </div>

        <!-- Username Setup Screen (after Google OAuth) -->
        <div id="username-setup" class="username-setup">
            <h1>Set Your Username</h1>
            <p style="margin-bottom: 1.5rem; color: #ccc;">Please choose a username to complete your registration</p>
            <form onsubmit="handleUsernameSetup(event)">
                <div class="form-group">
                    <label for="setup-username">Username</label>
                    <input type="text" id="setup-username" placeholder="Choose a username" required>
                </div>
                <button type="submit" class="auth-btn">Set Username</button>
            </form>
            <div id="setup-message" class="message"></div>
        </div>

        <!-- Auth Forms (Login/Register tabs) -->
        <div id="auth-forms" class="auth-forms">
            <h1>Welcome</h1>
            
            <div class="tabs">
                <div class="tab active" onclick="switchTab('login')">Login</div>
                <div class="tab" onclick="switchTab('register')">Register</div>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="form-container active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-username">Username</label>
                        <input type="text" id="login-username" placeholder="Enter your username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="auth-btn">Login</button>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form" class="form-container">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="register-username">Username</label>
                        <input type="text" id="register-username" placeholder="Choose a username" required>
                    </div>
                    <div class="form-group">
                        <label for="register-password">Password</label>
                        <input type="password" id="register-password" placeholder="Create a password" required>
                    </div>
                    <div class="form-group">
                        <label for="register-confirm-password">Confirm Password</label>
                        <input type="password" id="register-confirm-password" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="auth-btn">Register</button>
                </form>
            </div>

            <div id="message" class="message"></div>
        </div>

        <!-- Game World Screen -->
        <div id="game-world" class="game-world">
            <div class="game-field"></div>
            <div class="game-ui">
                <h3>🎮 Game World</h3>
                <p>Player: <span id="game-username">User</span></p>
                <button class="back-btn" onclick="exitGameWorld()">← Back to Dashboard</button>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in on page load
        async function checkAuth() {
            try {
                const response = await fetch('/auth/me');
                if (response.ok) {
                    const data = await response.json();
                    
                    // Check if user needs to set username
                    if (!data.user.hasUsername) {
                        showUsernameSetup();
                    } else {
                        showLoggedInScreen(data.user);
                    }
                } else {
                    showAuthForms();
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                showAuthForms();
            }
        }

        function showLoggedInScreen(user) {
            document.getElementById('auth-forms').classList.remove('active');
            document.getElementById('auth-forms').style.display = 'none';
            document.getElementById('username-setup').classList.remove('active');
            document.getElementById('username-setup').style.display = 'none';
            document.getElementById('logged-in-screen').classList.add('active');
            document.getElementById('logged-in-screen').style.display = 'block';
            document.getElementById('logged-username').textContent = user.username || 'User';
            document.getElementById('game-username').textContent = user.username || 'User';
        }

        function showUsernameSetup() {
            document.getElementById('auth-forms').classList.remove('active');
            document.getElementById('auth-forms').style.display = 'none';
            document.getElementById('logged-in-screen').classList.remove('active');
            document.getElementById('logged-in-screen').style.display = 'none';
            document.getElementById('username-setup').classList.add('active');
            document.getElementById('username-setup').style.display = 'block';
        }

        function showAuthForms() {
            document.getElementById('logged-in-screen').classList.remove('active');
            document.getElementById('username-setup').classList.remove('active');
            document.getElementById('auth-forms').classList.add('active');
            document.getElementById('auth-forms').style.display = 'block';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(f => f.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
            
            hideMessage();
        }

        function showMessage(text, type) {
            // Make sure auth forms are visible before showing message
            showAuthForms();
            
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        function hideMessage() {
            document.getElementById('message').style.display = 'none';
        }

        function showSetupMessage(text, type) {
            const messageDiv = document.getElementById('setup-message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        function hideSetupMessage() {
            document.getElementById('setup-message').style.display = 'none';
        }

        async function handleLogin(event) {
            event.preventDefault();
            hideMessage();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Reload to check auth status
                    window.location.reload();
                } else {
                    showMessage(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            hideMessage();
            
            const username = document.getElementById('register-username').value;
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;
            
            if (username.length < 3) {
                showMessage('Username must be at least 3 characters', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('Password must be at least 6 characters', 'error');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, confirmPassword })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Reload to check auth status
                    window.location.reload();
                } else {
                    showMessage(data.error || 'Registration failed', 'error');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'error');
            }
        }

        async function handleUsernameSetup(event) {
            event.preventDefault();
            hideSetupMessage();
            
            const username = document.getElementById('setup-username').value;
            
            if (username.length < 3) {
                showSetupMessage('Username must be at least 3 characters', 'error');
                return;
            }
            
            try {
                const response = await fetch('/auth/set-username', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Reload to check auth status
                    window.location.reload();
                } else {
                    showSetupMessage(data.error || 'Username setup failed', 'error');
                }
            } catch (error) {
                showSetupMessage('Network error. Please try again.', 'error');
            }
        }

        async function logout() {
            try {
                await fetch('/auth/logout', { method: 'POST' });
                showAuthForms();
            } catch (error) {
                showMessage('Logout failed', 'error');
            }
        }

        function enterGameWorld() {
            document.getElementById('logged-in-screen').classList.remove('active');
            document.getElementById('logged-in-screen').style.display = 'none';
            document.getElementById('game-world').classList.add('active');
            document.getElementById('game-world').style.display = 'block';
        }

        function exitGameWorld() {
            document.getElementById('game-world').classList.remove('active');
            document.getElementById('game-world').style.display = 'none';
            document.getElementById('logged-in-screen').classList.add('active');
            document.getElementById('logged-in-screen').style.display = 'block';
        }

        // Check for URL parameters on page load
        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            const setupUsername = urlParams.get('setup_username');
            
            let shouldShowAuthForms = false;
            
            if (error === 'google_auth_failed') {
                showMessage('Google authentication failed. Please try again.', 'error');
                shouldShowAuthForms = true;
            }
            
            if (setupUsername === 'true') {
                showUsernameSetup();
                shouldShowAuthForms = false;
            }
            
            // Clear all URL parameters
            if (urlParams.toString()) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            
            return shouldShowAuthForms;
        }

        // Check auth status on page load
        async function checkAuth() {
            try {
                const response = await fetch('/auth/me');
                if (response.ok) {
                    const data = await response.json();
                    
                    // Check if user needs to set username
                    if (!data.user.hasUsername) {
                        showUsernameSetup();
                    } else {
                        showLoggedInScreen(data.user);
                    }
                } else {
                    showAuthForms();
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                showAuthForms();
            }
        }

        // Initialize page - check URL params first, then auth
        async function initPage() {
            const showAuthDueToError = checkUrlParams();
            if (!showAuthDueToError) {
                await checkAuth();
            } else {
                showAuthForms();
            }
        }

        // Initialize the page
        initPage();
    </script>
</body>
</html>
